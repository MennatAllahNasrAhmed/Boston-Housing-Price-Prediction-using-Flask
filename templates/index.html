<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boston Housing Price Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Boston Housing Price Prediction</h1>

        <p class="description">
            Enter the housing features to predict the house price.
        </p>

        <form action="/predict" method="POST">

            <label for="RM">
                RM - Average Number of Rooms
            </label>

            <input
                type="number"
                step="any"
                id="RM"
                name="RM"
                placeholder="Example: 6.575"
                required
            >


            <label for="LSTAT">
                LSTAT - Lower Status Population (%)
            </label>

            <input
                type="number"
                step="any"
                id="LSTAT"
                name="LSTAT"
                placeholder="Example: 4.98"
                required
            >


            <label for="PTRATIO">
                PTRATIO - Pupil-Teacher Ratio
            </label>

            <input
                type="number"
                step="any"
                id="PTRATIO"
                name="PTRATIO"
                placeholder="Example: 15.3"
                required
            >


            <button type="submit">
                Predict
            </button>

        </form>


        {% if prediction is defined %}

        <div class="result">

            <h2>
                Predicted House Price:
            </h2>

            <p>
                {{ prediction }}
            </p>

        </div>

        {% endif %}


        {% if error is defined %}

        <div class="error">

            <p>{{ error }}</p>

        </div>

        {% endif %}

    </div>

</body>

</html>
